<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <title>3 - Grouped sheet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0A0B0D;
      color: #F7F8F6;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding: 0;
      overflow-x: hidden;
    }
    .mobile-frame {
      width: 100%;
      max-width: 420px;
      min-height: 100dvh;
      background-color: #0A0B0D;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
    }
    /* Dimmed Workout Backdrop */
    .status-bar {
      height: 44px;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      color: #C3C8CC;
    }
    .workout-content {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 16px 20px;
      opacity: 0.3;
      pointer-events: none;
      filter: blur(0.6px);
    }
    .workout-title-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 44px;
      margin-bottom: 20px;
    }
    .workout-name {
      font-size: 20px;
      font-weight: 700;
      color: #F7F8F6;
      letter-spacing: -0.02em;
    }
    .workout-timer {
      font-size: 14px;
      font-weight: 500;
      color: #C3C8CC;
    }
    .exercise-card {
      background-color: #16181B;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
    }
    .card-title-group h3 {
      font-size: 17px;
      font-weight: 600;
      color: #F7F8F6;
      margin-bottom: 2px;
    }
    .card-title-group p {
      font-size: 13px;
      color: #C3C8CC;
    }
    .three-dots-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #1F2225;
      border-radius: 8px;
      color: #F7F8F6;
    }

    /* Backdrop Overlay */
    .overlay-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(10, 11, 13, 0.6);
      z-index: 10;
    }

    /* 3 - Grouped Sheet with Mixed Layout */
    .grouped-sheet {
      position: relative;
      z-index: 20;
      width: 100%;
      background-color: #16181B;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 12px 20px 24px 20px;
      box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      animation: slideUp 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    /* Drag Handle */
    .drag-handle {
      width: 38px;
      height: 4px;
      background-color: #2B2F34;
      border-radius: 999px;
      margin: 0 auto 10px auto;
    }

    /* Header Nav with Left 44px Close X & Right 44px Red Trash */
    .sheet-header-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 44px;
      margin-bottom: 4px;
    }
    .header-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      background: #1F2225;
      color: #C3C8CC;
      transition: background-color 0.15s;
    }
    .header-btn:active {
      background-color: #2B2F34;
    }
    .header-btn.trash-btn {
      background-color: #4A2B2D;
      color: #FF8A8A;
    }
    .header-btn.trash-btn:active {
      background-color: #633336;
    }
    .sheet-title-text {
      font-size: 17px;
      font-weight: 700;
      color: #F7F8F6;
      text-align: center;
    }

    .sheet-context-subtitle {
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      color: #C3C8CC;
      margin-bottom: 16px;
    }

    /* Sheet Body - scrollable if needed */
    .sheet-body-content {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: calc(100dvh - 190px);
      overflow-y: auto;
    }

    .group-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .group-heading {
      font-size: 14px;
      font-weight: 500;
      color: #C3C8CC;
      padding-left: 4px;
    }

    /* Purpose Group 1: 'Log & setup' - Three equal touch tiles */
    .tiles-tray {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .touch-tile {
      height: 88px;
      background-color: #1F2225;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 6px;
      border: none;
      cursor: pointer;
      text-align: center;
      gap: 6px;
      transition: background-color 0.15s;
    }
    .touch-tile:active {
      background-color: #2B2F34;
    }
    .tile-icon {
      width: 22px;
      height: 22px;
      stroke: #C3C8CC;
      stroke-width: 1.75;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .touch-tile:hover .tile-icon {
      stroke: #F7F8F6;
    }
    .tile-label {
      font-size: 13px;
      font-weight: 600;
      color: #F7F8F6;
      line-height: 1.2;
      word-break: break-word;
    }

    /* Purpose Group 2 & 3: Connected tonal container rows */
    .connected-tray {
      background-color: #1F2225;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .tray-row {
      display: flex;
      align-items: center;
      gap: 14px;
      height: 48px;
      min-height: 48px;
      padding: 0 16px;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      cursor: pointer;
      border-bottom: 1px solid #16181B;
    }
    .tray-row:last-child {
      border-bottom: none;
    }
    .tray-row:active {
      background-color: #2B2F34;
    }
    .row-icon {
      width: 20px;
      height: 20px;
      stroke: #C3C8CC;
      stroke-width: 1.75;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .tray-row:hover .row-icon {
      stroke: #F7F8F6;
    }
    .row-label {
      font-size: 15px;
      font-weight: 500;
      color: #F7F8F6;
      flex: 1;
    }

    /* Honest caption outside menu */
    .honest-caption {
      text-align: center;
      font-size: 11px;
      font-weight: 500;
      color: #C3C8CC;
      opacity: 0.6;
      letter-spacing: 0.04em;
      margin-top: 14px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="mobile-frame" id="appFrame">
    <!-- Dimmed Background workout -->
    <div class="workout-content" aria-hidden="true">
      <div class="status-bar" style="padding: 0;">
        <span>09:41</span>
        <span>Forge · Chest & Shoulders</span>
      </div>
      <div class="workout-title-row">
        <div>
          <h1 class="workout-name">Push Day Hypertrophy</h1>
          <p style="font-size: 13px; color: #C3C8CC; margin-top: 2px;">Workout in progress · 4 of 6 exercises</p>
        </div>
        <div class="workout-timer">42:18</div>
      </div>
      <div class="exercise-card">
        <div class="card-header">
          <div class="card-title-group">
            <h3>Barbell Bench Press</h3>
            <p>Chest · Compound Primary</p>
          </div>
          <div class="three-dots-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <circle cx="12" cy="5" r="2"></circle>
              <circle cx="12" cy="12" r="2"></circle>
              <circle cx="12" cy="19" r="2"></circle>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Backdrop Overlay -->
    <div class="overlay-backdrop" id="overlay" onclick="dismissSheet()"></div>

    <!-- 3 - Grouped Sheet -->
    <div class="grouped-sheet" role="dialog" aria-modal="true" aria-label="Exercise options">
      <div class="drag-handle" aria-hidden="true"></div>

      <!-- Header with Close X, Title, and Header Trash -->
      <div class="sheet-header-nav">
        <button class="header-btn" onclick="dismissSheet()" aria-label="Close menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>

        <span class="sheet-title-text">Exercise options</span>

        <button class="header-btn trash-btn" aria-label="Remove exercise" title="Remove exercise">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      </div>

      <!-- Context Subtitle -->
      <div class="sheet-context-subtitle">Barbell Bench Press</div>

      <!-- Sheet Body -->
      <div class="sheet-body-content">
        <!-- Group 1: Log & setup (3 touch tiles in a row) -->
        <div class="group-section">
          <div class="group-heading">Log &amp; setup</div>
          <div class="tiles-tray">
            <!-- Tracking -->
            <button class="touch-tile">
              <svg class="tile-icon" viewBox="0 0 24 24">
                <line x1="18" y1="20" x2="18" y2="10"></line>
                <line x1="12" y1="20" x2="12" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="14"></line>
              </svg>
              <span class="tile-label">Tracking</span>
            </button>

            <!-- Add note -->
            <button class="touch-tile">
              <svg class="tile-icon" viewBox="0 0 24 24">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
              </svg>
              <span class="tile-label">Add note</span>
            </button>

            <!-- Warm-up sets -->
            <button class="touch-tile">
              <svg class="tile-icon" viewBox="0 0 24 24">
                <path d="M8.5 14.5A4.5 4.5 0 0 0 13 19a4.5 4.5 0 0 0 4.5-4.5c0-2.5-2-4.5-3-6-1 2-2 2-2.5 1-.5-1-.5-3.5-.5-3.5s-3 3.5-3 8.5z"></path>
              </svg>
              <span class="tile-label">Warm-up sets</span>
            </button>
          </div>
        </div>

        <!-- Group 2: Review (Connected tonal group with 2 rows) -->
        <div class="group-section">
          <div class="group-heading">Review</div>
          <div class="connected-tray">
            <!-- Previous sessions -->
            <button class="tray-row">
              <svg class="row-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"></circle>
                <polyline points="12 7 12 12 15 15"></polyline>
              </svg>
              <span class="row-label">Previous sessions</span>
            </button>

            <!-- Exercise info -->
            <button class="tray-row">
              <svg class="row-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
              </svg>
              <span class="row-label">Exercise info</span>
            </button>
          </div>
        </div>

        <!-- Group 3: Change exercise (Separate connected group with 2 rows) -->
        <div class="group-section">
          <div class="group-heading">Change exercise</div>
          <div class="connected-tray">
            <!-- Replace exercise -->
            <button class="tray-row">
              <svg class="row-icon" viewBox="0 0 24 24">
                <polyline points="16 3 21 3 21 8"></polyline>
                <line x1="4" y1="20" x2="21" y2="3"></line>
                <polyline points="21 16 21 21 16 21"></polyline>
                <line x1="15" y1="15" x2="21" y2="21"></line>
                <line x1="4" y1="4" x2="9" y2="9"></line>
              </svg>
              <span class="row-label">Replace exercise</span>
            </button>

            <!-- Mark off-session -->
            <button class="tray-row">
              <svg class="row-icon" viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                <line x1="8" y1="12" x2="16" y2="12"></line>
              </svg>
              <span class="row-label">Mark off-session</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Small Honest Caption Outside Menu -->
      <div class="honest-caption">Static concept · Demo data</div>
    </div>
  </div>

  <script>
    function dismissSheet() {
      const sheet = document.querySelector('.grouped-sheet');
      const overlay = document.getElementById('overlay');
      if (sheet) sheet.style.display = 'none';
      if (overlay) overlay.style.display = 'none';
    }
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') dismissSheet();
    });
  </script>
</body>
</html>
