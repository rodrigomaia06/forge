<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A - Quiet list</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0A0B0D;
      color: #F7F8F6;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="bg-[#0A0B0D] text-[#F7F8F6] min-h-screen flex justify-center selection:bg-neutral-800">
  <div class="w-full max-w-[420px] min-h-screen bg-[#0A0B0D] relative flex flex-col overflow-hidden pb-6">

    <!-- Active Workout Background (Dimmed) -->
    <div class="px-5 pt-8 pb-32 flex-1 filter blur-[1.5px] opacity-25 pointer-events-none select-none">
      <!-- Top Bar -->
      <div class="flex items-center justify-between mb-5">
        <div>
          <span class="text-[11px] font-semibold tracking-wider uppercase text-[#C3C8CC]">Active Workout</span>
          <h1 class="text-xl font-bold tracking-tight text-[#F7F8F6]">Chest & Triceps Power</h1>
        </div>
        <div class="flex items-center gap-2">
          <span class="px-2.5 py-1 bg-[#1F2225] border border-[#2B2F34] rounded-full text-xs font-mono font-medium text-[#C3C8CC]">38:42</span>
        </div>
      </div>

      <!-- Workout Exercise Card -->
      <div class="bg-[#16181B] border border-[#2B2F34] rounded-2xl p-4 mb-4">
        <div class="flex items-start justify-between">
          <div>
            <h2 class="text-base font-bold text-[#F7F8F6]">Barbell Bench Press</h2>
            <p class="text-xs text-[#C3C8CC] mt-0.5">Primary Chest · Heavy compound</p>
          </div>
          <button class="w-8 h-8 rounded-full bg-[#1F2225] flex items-center justify-center text-[#C3C8CC]">•••</button>
        </div>

        <div class="mt-4 space-y-2">
          <div class="flex justify-between text-[11px] font-medium text-[#C3C8CC] px-2">
            <span>SET</span><span>PREV</span><span>KG</span><span>REPS</span><span>STATUS</span>
          </div>
          <div class="flex justify-between items-center text-xs bg-[#1F2225] px-3 py-2 rounded-lg text-[#F7F8F6]">
            <span class="font-bold text-[#C3C8CC]">1</span>
            <span>90 kg × 8</span>
            <span class="font-semibold">92.5</span>
            <span class="font-semibold">8</span>
            <span class="text-emerald-400 font-bold">✓</span>
          </div>
          <div class="flex justify-between items-center text-xs bg-[#1F2225] px-3 py-2 rounded-lg text-[#F7F8F6]">
            <span class="font-bold text-[#C3C8CC]">2</span>
            <span>90 kg × 7</span>
            <span class="font-semibold">92.5</span>
            <span class="font-semibold">7</span>
            <span class="text-emerald-400 font-bold">✓</span>
          </div>
          <div class="flex justify-between items-center text-xs bg-[#1F2225] px-3 py-2 rounded-lg text-[#F7F8F6]">
            <span class="font-bold text-[#C3C8CC]">3</span>
            <span>90 kg × 6</span>
            <span class="font-semibold">92.5</span>
            <span class="font-semibold">6</span>
            <span class="text-[#C3C8CC]">...</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Dock Behind Overlay (Preserved Tabs) -->
    <div class="fixed bottom-0 left-0 right-0 max-w-[420px] mx-auto z-10 px-5 pb-5 pointer-events-none">
      <div class="bg-[#16181B]/90 backdrop-blur-md border border-[#2B2F34] rounded-2xl py-3 px-4 flex justify-between items-center shadow-2xl opacity-40">
        <div class="flex flex-col items-center gap-1 text-[#C3C8CC]">
          <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2"><path d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h3a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1h3a1 1 0 001-1V10"/></svg>
          <span class="text-[10px] font-medium">Home</span>
        </div>
        <div class="flex flex-col items-center gap-1 text-[#C3C8CC]">
          <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span class="text-[10px] font-medium">History</span>
        </div>
        <div class="flex flex-col items-center gap-1 text-[#F7F8F6]">
          <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2"><path d="M6 5v14M18 5v14M2 9v6M22 9v6M6 12h12"/></svg>
          <span class="text-[10px] font-semibold">Workout</span>
        </div>
        <div class="flex flex-col items-center gap-1 text-[#C3C8CC]">
          <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
          <span class="text-[10px] font-medium">Plans</span>
        </div>
        <div class="flex flex-col items-center gap-1 text-[#C3C8CC]">
          <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          <span class="text-[10px] font-medium">Settings</span>
        </div>
      </div>
    </div>

    <!-- Backdrop Overlay -->
    <div class="fixed inset-0 bg-black/65 backdrop-blur-[2px] z-20"></div>

    <!-- VARIANT A SHEET: Bottom-attached, Quiet List -->
    <div class="fixed bottom-0 left-0 right-0 max-w-[420px] mx-auto z-30 bg-[#16181B] rounded-t-[24px] border-t border-x border-[#2B2F34] shadow-2xl flex flex-col max-h-[calc(100dvh-60px)] animate-none">
      
      <!-- Top Handle Bar -->
      <div class="w-full flex justify-center pt-3 pb-2 cursor-grab">
        <div class="w-10 h-1 rounded-full bg-[#2B2F34]"></div>
      </div>

      <!-- Header with 44px Hit Targets -->
      <div class="px-5 pb-3 pt-1 flex items-center justify-between border-b border-[#2B2F34]/60">
        <!-- 44px Circular Close Button at Left -->
        <button aria-label="Close options" class="w-11 h-11 min-w-[44px] min-h-[44px] rounded-full bg-[#1F2225] border border-[#2B2F34] flex items-center justify-center text-[#F7F8F6] hover:bg-[#2B2F34] transition-colors">
          <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>

        <!-- Centered Title & Exercise Context -->
        <div class="text-center flex-1 px-2">
          <h2 class="text-base font-bold tracking-tight text-[#F7F8F6] leading-snug">Exercise options</h2>
          <p class="text-[12px] font-medium text-[#C3C8CC] truncate">Barbell Bench Press</p>
        </div>

        <!-- 44px Circular Destructive Trash at Right -->
        <button aria-label="Remove Barbell Bench Press" class="w-11 h-11 min-w-[44px] min-h-[44px] rounded-full bg-[#4A2B2D] border border-[#FF8A8A]/30 flex items-center justify-center text-[#FF8A8A] hover:bg-[#5a3336] transition-colors">
          <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path>
          </svg>
        </button>
      </div>

      <!-- Scrollable Sheet Content -->
      <div class="overflow-y-auto px-5 py-4 space-y-4">
        <!-- Variant A Grouped List: Flat connected compact 56px rows, bare neutral icons, gentle separators -->
        <div class="bg-[#1F2225] border border-[#2B2F34] rounded-[16px] overflow-hidden">
          
          <!-- Row 1: Tracking -->
          <button class="w-full h-14 min-h-[56px] px-4 flex items-center justify-between text-left hover:bg-[#2B2F34]/50 transition-colors">
            <div class="flex items-center gap-3.5">
              <svg class="w-5 h-5 text-[#C3C8CC] stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="20" x2="18" y2="10"></line>
                <line x1="12" y1="20" x2="12" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="14"></line>
              </svg>
              <span class="text-sm font-semibold text-[#F7F8F6]">Tracking</span>
            </div>
            <svg class="w-4 h-4 text-[#C3C8CC]/70 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
          <div class="h-px bg-[#2B2F34] ml-12"></div>

          <!-- Row 2: Add note -->
          <button class="w-full h-14 min-h-[56px] px-4 flex items-center justify-between text-left hover:bg-[#2B2F34]/50 transition-colors">
            <div class="flex items-center gap-3.5">
              <svg class="w-5 h-5 text-[#C3C8CC] stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
              <span class="text-sm font-semibold text-[#F7F8F6]">Add note</span>
            </div>
            <svg class="w-4 h-4 text-[#C3C8CC]/70 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
          <div class="h-px bg-[#2B2F34] ml-12"></div>

          <!-- Row 3: Previous sessions -->
          <button class="w-full h-14 min-h-[56px] px-4 flex items-center justify-between text-left hover:bg-[#2B2F34]/50 transition-colors">
            <div class="flex items-center gap-3.5">
              <svg class="w-5 h-5 text-[#C3C8CC] stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 14 14"></polyline>
                <path d="M3.05 11a9 9 0 0117.9 0"></path>
              </svg>
              <span class="text-sm font-semibold text-[#F7F8F6]">Previous sessions</span>
            </div>
            <svg class="w-4 h-4 text-[#C3C8CC]/70 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
          <div class="h-px bg-[#2B2F34] ml-12"></div>

          <!-- Row 4: Warm-up sets -->
          <button class="w-full h-14 min-h-[56px] px-4 flex items-center justify-between text-left hover:bg-[#2B2F34]/50 transition-colors">
            <div class="flex items-center gap-3.5">
              <svg class="w-5 h-5 text-[#C3C8CC] stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"></path>
              </svg>
              <span class="text-sm font-semibold text-[#F7F8F6]">Warm-up sets</span>
            </div>
            <svg class="w-4 h-4 text-[#C3C8CC]/70 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
          <div class="h-px bg-[#2B2F34] ml-12"></div>

          <!-- Row 5: Exercise info -->
          <button class="w-full h-14 min-h-[56px] px-4 flex items-center justify-between text-left hover:bg-[#2B2F34]/50 transition-colors">
            <div class="flex items-center gap-3.5">
              <svg class="w-5 h-5 text-[#C3C8CC] stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
              </svg>
              <span class="text-sm font-semibold text-[#F7F8F6]">Exercise info</span>
            </div>
            <svg class="w-4 h-4 text-[#C3C8CC]/70 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
          <div class="h-px bg-[#2B2F34] ml-12"></div>

          <!-- Row 6: Replace exercise -->
          <button class="w-full h-14 min-h-[56px] px-4 flex items-center justify-between text-left hover:bg-[#2B2F34]/50 transition-colors">
            <div class="flex items-center gap-3.5">
              <svg class="w-5 h-5 text-[#C3C8CC] stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="16 3 21 3 21 8"></polyline>
                <line x1="4" y1="20" x2="21" y2="3"></line>
                <polyline points="21 16 21 21 16 21"></polyline>
                <line x1="15" y1="15" x2="21" y2="21"></line>
                <line x1="4" y1="4" x2="9" y2="9"></line>
              </svg>
              <span class="text-sm font-semibold text-[#F7F8F6]">Replace exercise</span>
            </div>
            <svg class="w-4 h-4 text-[#C3C8CC]/70 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
          <div class="h-px bg-[#2B2F34] ml-12"></div>

          <!-- Row 7: Mark off-session -->
          <button class="w-full h-14 min-h-[56px] px-4 flex items-center justify-between text-left hover:bg-[#2B2F34]/50 transition-colors">
            <div class="flex items-center gap-3.5">
              <svg class="w-5 h-5 text-[#C3C8CC] stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="9" y1="9" x2="15" y2="15"></line>
                <line x1="15" y1="9" x2="9" y2="15"></line>
              </svg>
              <span class="text-sm font-semibold text-[#F7F8F6]">Mark off-session</span>
            </div>
            <svg class="w-4 h-4 text-[#C3C8CC]/70 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>

        </div>

        <!-- Demo Data Caption & Variant Tag -->
        <div class="pt-1 pb-2 flex items-center justify-between text-[11px] text-[#C3C8CC]/60 font-medium">
          <span>Demo data</span>
          <span>Variant A · Quiet list</span>
        </div>
      </div>

    </div>

  </div>
</body>
</html>
