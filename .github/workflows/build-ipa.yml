name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.repository }}
  cancel-in-progress: false

jobs:
  trigger-build:
    name: Trigger internal iOS build
    # EAS performs the native build remotely. A standard Linux runner is both
    # faster to start and substantially cheaper than occupying a macOS runner.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - name: Verify Expo access
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN repository secret before running this workflow."
            exit 1
          fi
      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install config dependencies
        # EAS resolves app plugins locally before it can upload the project.
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Create internal-distribution IPA on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform ios --profile preview --non-interactive --no-wait
