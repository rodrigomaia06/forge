name: Build unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-ipa:
    name: Build unsigned iOS IPA
    # Xcode is necessary for a device IPA. This direct macOS build avoids the
    # EAS iOS-build quota; the EXPO_TOKEN secret may remain configured but is
    # intentionally not required by this workflow.
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - name: Select Xcode with Swift 6.2
        # ExpoModulesJSI's SwiftPM package declares swift-tools-version 6.2.
        # macos-15 still defaults to Xcode 16.4 (Swift 6.1), even though the
        # image also includes Xcode 26.3.
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Patch ExpoModulesJSI for Xcode 26
        # SDK 57 annotates C++ constructors with SWIFT_RETURNS_RETAINED. Xcode
        # 26's Swift 6.2 compiler rejects that annotation on constructors;
        # removing the two annotations preserves their normal shared-reference
        # ownership semantics. The same SDK's strict Swift 6 mode then rejects
        # its own actor-isolated raw-pointer trampolines, so compile this
        # dependency in Swift 5 mode until Expo completes that migration. Keep
        # the count checks so an Expo update cannot silently drift this patch.
        run: |
          set -euo pipefail
          HEADER='node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h'
          MANIFEST='node_modules/expo-modules-jsi/apple/Package.swift'
          test "$(grep -F -c 'SWIFT_RETURNS_RETAINED RuntimeScheduler' "$HEADER")" -eq 2
          test "$(grep -F -c 'swiftLanguageModes: [.v6]' "$MANIFEST")" -eq 1
          perl -0pi -e 's/SWIFT_RETURNS_RETAINED RuntimeScheduler/RuntimeScheduler/g' "$HEADER"
          perl -0pi -e 's/swiftLanguageModes: \[\.v6\]/swiftLanguageModes: [.v5]/g' "$MANIFEST"
          ! grep -F 'SWIFT_RETURNS_RETAINED RuntimeScheduler' "$HEADER"
          grep -Fqx '  swiftLanguageModes: [.v5],' "$MANIFEST"
      - name: Generate the iOS project
        # Prebuild also runs Forge's local plugin, which adds the direct
        # ActivityKit extension and the app-local numeric range keyboard.
        run: npx expo prebuild --no-install --platform ios
      - name: Install CocoaPods
        working-directory: ios
        run: pod install
      - name: Archive unsigned device app
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -workspace ios/Forge.xcworkspace \
            -scheme Forge \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Forge.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            | tee build/xcodebuild.log
      - name: Package and validate IPA
        run: |
          set -euo pipefail
          APP_PATH='build/Forge.xcarchive/Products/Applications/Forge.app'
          WIDGET_PATH="$APP_PATH/PlugIns/ForgeRestTimerWidget.appex"
          test -x "$APP_PATH/Forge"
          test -f "$APP_PATH/Info.plist"
          test -x "$WIDGET_PATH/ForgeRestTimerWidget"
          test -f "$WIDGET_PATH/Info.plist"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"
          test "$EXECUTABLE" = 'Forge'
          mkdir -p artifacts/Payload
          ditto "$APP_PATH" artifacts/Payload/Forge.app
          (
            cd artifacts
            /usr/bin/zip -qry Forge-unsigned.ipa Payload
          )
          unzip -t artifacts/Forge-unsigned.ipa >/dev/null
          unzip -Z1 artifacts/Forge-unsigned.ipa | grep -qx 'Payload/Forge.app/Forge'
          unzip -Z1 artifacts/Forge-unsigned.ipa | grep -qx 'Payload/Forge.app/PlugIns/ForgeRestTimerWidget.appex/ForgeRestTimerWidget'
          {
            echo '## Unsigned IPA built on GitHub macOS'
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo "Xcode: \`$(xcodebuild -version | tr '\n' ' ')\`"
            echo 'Signing: disabled; iLoader re-signs the IPA before installation.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload IPA to GitHub
        uses: actions/upload-artifact@v6
        with:
          name: Forge-unsigned-ios-ipa
          path: artifacts/Forge-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload native build logs to GitHub
        uses: actions/upload-artifact@v6
        with:
          name: Forge-unsigned-ios-build-logs
          path: build/xcodebuild.log
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
