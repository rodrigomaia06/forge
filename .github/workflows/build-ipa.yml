name: Build unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.repository }}
  cancel-in-progress: false

jobs:
  trigger-build:
    name: Trigger unsigned iOS build
    # EAS performs the native compilation remotely. A standard Linux runner is
    # faster to start and substantially cheaper than occupying a macOS runner.
    runs-on: ubuntu-latest
    # EAS runs the native build independently; this Linux runner only polls it
    # so the GitHub run shows its actual state and can retain its artifacts.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - name: Verify Expo access
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN repository secret before running this workflow."
            exit 1
          fi
      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install config dependencies
        # EAS resolves app plugins locally before it can upload the project.
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Start unsigned IPA build on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform ios --profile sideload --non-interactive --no-wait --json > /tmp/forge-eas-build.json
          BUILD_ID="$(node -e "const builds = require('/tmp/forge-eas-build.json'); const build = Array.isArray(builds) ? builds[0] : builds; if (!build?.id) throw new Error('EAS did not return a build ID'); process.stdout.write(build.id);")"
          BUILD_URL="$(node -e "const builds = require('/tmp/forge-eas-build.json'); const build = Array.isArray(builds) ? builds[0] : builds; process.stdout.write(build?.buildDetailsPageUrl ?? '');")"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "build_url=$BUILD_URL" >> "$GITHUB_OUTPUT"
          {
            echo "## EAS unsigned iOS build"
            echo
            echo "Build ID: \`$BUILD_ID\`"
            if [ -n "$BUILD_URL" ]; then echo "[Open EAS build]($BUILD_URL)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
        id: eas-build
      - name: Poll EAS build status
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ steps.eas-build.outputs.build_id }}
          BUILD_URL: ${{ steps.eas-build.outputs.build_url }}
        run: |
          set -eu
          while :; do
            eas build:view "$BUILD_ID" --json > /tmp/forge-eas-status.json
            STATUS="$(node -e "const build = require('/tmp/forge-eas-status.json'); process.stdout.write(build.status ?? 'unknown');")"
            NORMALIZED_STATUS="$(printf '%s' "$STATUS" | tr '[:upper:]' '[:lower:]')"
            echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ') EAS build $BUILD_ID: $STATUS"
            echo "EAS status: \`$STATUS\`" >> "$GITHUB_STEP_SUMMARY"
            case "$NORMALIZED_STATUS" in
              finished) break ;;
              errored|canceled)
                if [ -n "$BUILD_URL" ]; then echo "::error::EAS build $STATUS: $BUILD_URL"; fi
                exit 1
                ;;
            esac
            sleep 30
          done
      - name: Download the completed IPA and diagnostics
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          BUILD_ID="${{ steps.eas-build.outputs.build_id }}"
          eas build:view "$BUILD_ID" --json > /tmp/forge-eas-final.json
          node scripts/eas-build-artifacts.mjs /tmp/forge-eas-final.json > /tmp/forge-eas-artifacts.json
          IPA_URL="$(node -e "process.stdout.write(require('/tmp/forge-eas-artifacts.json').applicationArchiveUrl);")"
          LOGS_URL="$(node -e "process.stdout.write(require('/tmp/forge-eas-artifacts.json').xcodeBuildLogsUrl ?? '');")"
          mkdir -p artifacts/logs
          printf 'build_id=%s\nstatus=FINISHED\nbuild_url=%s\napplication_archive_url=%s\n' "$BUILD_ID" "${{ steps.eas-build.outputs.build_url }}" "$IPA_URL" > artifacts/logs/eas-build-status.txt
          curl --fail --location --retry 3 --retry-delay 2 --retry-all-errors --output artifacts/Forge-unsigned.ipa "$IPA_URL"
          unzip -t artifacts/Forge-unsigned.ipa >/dev/null
          if ! unzip -Z1 artifacts/Forge-unsigned.ipa | grep -q '^Payload/Forge\.app/'; then
            echo '::error::The EAS application archive is not an installable Forge IPA.'
            exit 1
          fi
          if [ -n "$LOGS_URL" ]; then
            if ! curl --fail --location --retry 3 --retry-delay 2 --retry-all-errors --output artifacts/logs/xcode-build-logs.tar.gz "$LOGS_URL"; then
              rm -f artifacts/logs/xcode-build-logs.tar.gz
              echo '::warning::Could not download EAS Xcode build logs; the IPA is still available.'
            fi
          else
            echo 'No EAS Xcode log archive was published for this build.' >> artifacts/logs/eas-build-status.txt
          fi
          echo 'IPA validated and downloaded from EAS applicationArchiveUrl.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload IPA to GitHub
        uses: actions/upload-artifact@v6
        with:
          name: Forge-unsigned-ios-ipa
          path: artifacts/Forge-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload EAS build logs to GitHub
        uses: actions/upload-artifact@v6
        with:
          name: Forge-unsigned-ios-build-logs
          path: artifacts/logs
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
