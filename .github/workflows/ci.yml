name: CI

# Builds, tests and photographs Forge on a GitHub-hosted macOS runner, the only build environment
# (the maintainer has no Mac). Jobs run in parallel:
#
#   test              unit and integration tests (ForgeTests, minus the capture tests)
#   screenshots       split screenshot captures, each capped at 20 minutes
#   ipa               an unsigned .ipa for AltStore / SideStore
#
# Screenshot captures used to share one simulator job. Split, one stuck walkthrough costs its
# own 20 minute job instead of holding the whole workflow for an hour.
#
# The .xcodeproj is generated from project.yml each run.

on:
  # Run on every branch push, so each run is named after its commit rather than a pull request. A push
  # run still reports its status on any open PR for the same commit, so PR checks keep working.
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (unit & integration)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: .github/scripts/select-xcode.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick a simulator
        run: .github/scripts/pick-simulator.sh

      - name: Run tests
        run: |
          set -euo pipefail
          echo "Testing on: $SIMULATOR_NAME"
          # ScreenshotTests only renders components to PNGs; it runs in the screenshots job instead.
          xcodebuild test \
            -project Forge.xcodeproj \
            -scheme Forge \
            -destination "platform=iOS Simulator,name=$SIMULATOR_NAME,OS=latest" \
            -resultBundlePath TestResults.xcresult \
            -only-testing:ForgeTests \
            -skip-testing:ForgeTests/ScreenshotTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # Only when something failed. A green run should leave two artifacts and no guesswork about
      # which one to open: the screenshots, and the .ipa.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore

  screenshots:
    name: Screenshots (${{ matrix.group }})
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: components
            only_testing: |
              ForgeTests/ScreenshotTests
          - group: tabs
            only_testing: |
              ForgeUITests/ScreenshotUITests/testTabs
          - group: home
            only_testing: |
              ForgeUITests/ScreenshotUITests/testHome
          - group: history
            only_testing: |
              ForgeUITests/ScreenshotUITests/testHistory
          - group: running-workout
            only_testing: |
              ForgeUITests/ScreenshotUITests/testRunningWorkout
          - group: value-field-regressions
            only_testing: |
              ForgeUITests/ScreenshotUITests/testSetOptionsSurvivesUnderlyingValueCommit
              ForgeUITests/ScreenshotUITests/testValueFieldTeardownSurvivesSetCompletion
          - group: workout-plans
            only_testing: |
              ForgeUITests/ScreenshotUITests/testWorkoutPlans
          - group: exercises
            only_testing: |
              ForgeUITests/ScreenshotUITests/testExercises
          - group: settings
            only_testing: |
              ForgeUITests/ScreenshotUITests/testSettings
              ForgeUITests/ScreenshotUITests/testLightAppearance
          - group: workout-types
            only_testing: |
              ForgeUITests/ScreenshotUITests/testWorkoutTypes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: .github/scripts/select-xcode.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick a simulator
        run: .github/scripts/pick-simulator.sh

      - name: Capture
        env:
          # Read by ScreenshotTests, which writes each PNG here as well as attaching it.
          # SIMCTL_CHILD_ is what carries a variable into the process running inside the simulator.
          SIMCTL_CHILD_FORGE_SCREENSHOT_DIR: ${{ github.workspace }}/screenshots/${{ matrix.group }}
          SCREENSHOT_ONLY_TESTING: ${{ matrix.only_testing }}
        run: |
          set -euo pipefail
          echo "Capturing ${{ matrix.group }} on: $SIMULATOR_NAME"
          mkdir -p "$SIMCTL_CHILD_FORGE_SCREENSHOT_DIR"

          ONLY_TESTING_ARGS=()
          while IFS= read -r target; do
            if [[ -n "$target" ]]; then
              ONLY_TESTING_ARGS+=("-only-testing:$target")
            fi
          done <<< "$SCREENSHOT_ONLY_TESTING"

          # A capture run should hand back every screen it did reach, so one broken path does not
          # cost the rest. The walkthrough records a skipped step rather than failing the run.
          xcodebuild test \
            -project Forge.xcodeproj \
            -scheme Forge \
            -destination "platform=iOS Simulator,name=$SIMULATOR_NAME,OS=latest" \
            -resultBundlePath ScreenshotResults.xcresult \
            "${ONLY_TESTING_ARGS[@]}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Recover the screenshots from the result bundle
        if: always()
        run: |
          set -euo pipefail
          DIR="${{ github.workspace }}/screenshots/${{ matrix.group }}"
          RAW="${{ github.workspace }}/screenshots-raw/${{ matrix.group }}"
          mkdir -p "$DIR" "$RAW"
          xcrun xcresulttool export attachments \
            --path ScreenshotResults.xcresult \
            --output-path "$RAW" || {
              echo 'Could not export attachments.'
              exit 0
            }
          .github/scripts/recover-screenshots.py "$RAW" "$DIR"
          echo "Recovered:"
          ls -1 "$DIR"

      # The one screenshot artifact. The .xcresult bundle is deliberately not uploaded: it was 125 MB,
      # mostly video recordings and duplicate attachments, and everything worth reading out of it (the
      # images, and a note plus hierarchy dump for any step the walkthrough could not reach) is already
      # recovered into this folder.
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.group }}
          path: ${{ github.workspace }}/screenshots/${{ matrix.group }}
          if-no-files-found: warn

  ipa:
    name: Package unsigned .ipa (AltStore / SideStore)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: .github/scripts/select-xcode.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned (Release, device)
        run: |
          xcodebuild build \
            -project Forge.xcodeproj \
            -scheme Forge \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        run: |
          set -euo pipefail
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          echo "Packaging: $APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Forge-unsigned.ipa Payload
          ls -lh Forge-unsigned.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Forge-unsigned-ipa
          path: Forge-unsigned.ipa
          if-no-files-found: error
