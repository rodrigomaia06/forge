build:
  name: Forge unsigned iOS archive
  steps:
    - eas/checkout
    - eas/use_npm_token
    - eas/install_node_modules
    - eas/resolve_build_config
    - eas/prebuild
    - run:
        name: Install CocoaPods dependencies
        working_directory: ./ios
        command: pod install
    - run:
        name: Archive unsigned device app
        working_directory: ./ios
        command: |
          set -eu
          ARCHIVE_PATH="$PWD/build/Forge-unsigned.xcarchive"
          IPA_PATH="$PWD/build/Forge-unsigned.ipa"
          PAYLOAD_PATH="$PWD/build/Payload"

          xcodebuild \
            -workspace Forge.xcworkspace \
            -scheme Forge \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          rm -rf "$PAYLOAD_PATH"
          mkdir -p "$PAYLOAD_PATH"
          cp -R "$ARCHIVE_PATH/Products/Applications/Forge.app" "$PAYLOAD_PATH/"
          rm -f "$IPA_PATH"
          (
            cd "$PWD/build"
            /usr/bin/zip -qry "$IPA_PATH" Payload
          )
    - eas/find_and_upload_build_artifacts
